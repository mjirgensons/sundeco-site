name: Sync mirror from mjirgensons.github.io
# sundeco.ca mirror. Builds from the public main repo every hour:
#   /                   author page (Martin Jirgenson, list of books)
#   /steer-dont-guess/  the book site
# Canonical tags still point to https://mjirgensons.github.io/ while that is the main site.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mirror from main site
        run: |
          git clone --depth 1 https://github.com/mjirgensons/mjirgensons.github.io /tmp/main
          python3 /tmp/main/tools/build_mirror.py /tmp/out
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -r /tmp/out/. .
          echo "sundeco.ca" > CNAME
          touch .nojekyll
      - name: Commit if changed
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync from mjirgensons.github.io" && git push)
