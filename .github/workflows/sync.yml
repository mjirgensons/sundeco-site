name: Sync mirror from mjirgensons.github.io
# Parallel mirror of the book site. Copies docs/ from the public main repo every hour.
# Canonical tags still point to https://mjirgensons.github.io/, so search engines treat that as the original.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs from main site
        run: |
          git clone --depth 1 https://github.com/mjirgensons/mjirgensons.github.io /tmp/main
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name CNAME ! -name .nojekyll ! -name README.md -exec rm -rf {} +
          cp -r /tmp/main/docs/. .
          echo "sundeco.ca" > CNAME
          touch .nojekyll
      - name: Commit if changed
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync from mjirgensons.github.io" && git push)
